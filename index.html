<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <h2>💱 Currency Converter</h2>

    <form>

        <div class="amount">
            <p>Enter Amount</p>
            <input type="number" value="1" min="1">
        </div>

        <div class="dropdown">

            <div class="from">

                <p>From</p>

                <div class="select-container">

                    <img src="https://flagsapi.com/US/flat/64.png">

                    <select name="from"></select>

                </div>

            </div>

            <i class="fa-solid fa-arrow-right-arrow-left swap"></i>

            <div class="to">

                <p>To</p>

                <div class="select-container">

                    <img src="https://flagsapi.com/IN/flat/64.png">

                    <select name="to"></select>

                </div>

            </div>

        </div>

        <div class="msg">
            1 USD = 83 INR
        </div>

        <button>Get Exchange Rate</button>

    </form>

    <hr>

    <!-- Your Details -->
    <div class="developer">

        <h3>Developed By</h3>

        <p><strong>Name :</strong> Sandhya Mule</p>

        <p><strong>Email :</strong> sandhyamule801@gmail.com</p>

    </div>

    <!-- Digital Heroes Button -->
    <a href="https://digitalheroesco.com" target="_blank">
        <button class="dh-btn">
            Built for Digital Heroes
        </button>
    </a>

</div>

<script src="codes.js"></script>
<script src="index.js"></script>

</body>
</html>
